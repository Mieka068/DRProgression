## Same as fgadr_poc.yaml, with `base:` pointed at the Docker volume mounts (/data, /outputs
## -- see DOCKER.md) instead of Colab's Drive paths. All `data:`/`train:`/`solver:`/*_args
## sections are untouched from the paper's own config, including epochs: 20.
##
## Local (Docker) usage: copy next to DRG-Net's own configs/ folder and run:
##   python main.py -c configs/fgadr_local.yaml -overwrite
base:
  data_path: null
  data_index: '/outputs/module1_pkl/fgadr_classification_pkl.pkl'
  save_path: '/outputs/module1_runs/classification/fgadr/saves'
  log_path: '/outputs/module1_runs/classification/fgadr/logs'
  device: cuda
  random_seed: 1

data:
  num_classes: 5
  input_size: 512
  mean: [ 0.4577976167201996, 0.2596849203109741, 0.13276457786560059 ]
  std: [ 0.28394654393196106, 0.18262696266174316, 0.13211798667907715 ]
  sampling_strategy: instance_balanced
  sampling_weights_decay_rate: 0.9
  data_augmentation:
    - random_crop
    - horizontal_flip
    - vertical_flip
    - color_distortion
    - rotation
    - translation

train:
  network: resnet50
  pretrained: true
  checkpoint: null
  epochs: 20
  batch_size: 16
  num_workers: 2 # reduced from 8: Colab's default runtime has fewer CPU cores than the paper's workstation
  criterion: cross_entropy
  loss_weight: [2.92, 1.39, 0.5, 0.46, 1.03]
  loss_weight_decay_rate: 0
  warmup_epochs: 0
  kappa_prior: true
  save_interval: 5
  eval_interval: 1
  sample_view: false
  sample_view_interval: 100
  pin_memory: true

solver:
  optimizer: SGD
  learning_rate: 0.001
  lr_scheduler: clipped_cosine
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005

criterion_args:
  cross_entropy: {}
  mean_square_error: {}
  mean_absolute_error: {}
  smooth_L1: {}
  kappa_loss: {}
  focal_loss:
    alpha: 5
    reduction: mean

scheduler_args:
  exponential:
    gamma: 0.6
  multiple_steps:
    milestones: [15, 25, 45]
    gamma: 0.1
  cosine:
    T_max: 50
    eta_min: 0
  reduce_on_plateau:
    mode: min
    factor: 0.1
    patience: 5
    threshold: 0.0001
    eps: 0.00001
  clipped_cosine:
    T_max: 25
    min_lr: 0.0001

data_augmentation_args:
  horizontal_flip:
    prob: 0.5
  vertical_flip:
    prob: 0.5
  color_distortion:
    prob: 1.0
    brightness: 0.2
    contrast: 0.2
    saturation: 0
    hue: 0
  random_crop:
    prob: 0
    scale: [0.87, 1.15]
    ratio: [0.7, 1.3]
  rotation:
    prob: 1
    degrees: [-180, 180]
  translation:
    prob: 1
    range: [0.2, 0.2]
  grayscale:
    prob: 0.5
  gaussian_blur:
    prob: 0.2
    kernel_size: 7
    sigma: 0.5
  value_fill: 0
