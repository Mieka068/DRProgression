## Same as idrid_poc.yaml, with `base:` pointed at the Docker volume mounts (/data, /outputs
## -- see DOCKER.md) instead of Colab's Drive paths. epochs: 60 kept exactly as published.
##
## Local (Docker) usage: copy next to DRG-Net's own configs/ folder and run:
##   python main.py -c configs/idrid_local.yaml -overwrite
base:
  data_path: null
  data_index: '/outputs/module1_pkl/idrid_classification_pkl.pkl'
  save_path: '/outputs/module1_runs/classification/idrid/saves'
  log_path: '/outputs/module1_runs/classification/idrid/logs'
  device: cuda
  random_seed: 1

data:
  num_classes: 5
  input_size: 512
  mean: auto
  std: auto
  sampling_strategy: progressively_balanced
  sampling_weights_decay_rate: 0.9
  data_augmentation:
    - random_crop
    - horizontal_flip
    - vertical_flip
    - color_distortion
    - rotation

train:
  network: resnet50
  pretrained: true
  checkpoint: null
  epochs: 60
  batch_size: 32
  num_workers: 2 # reduced from 8: Colab's default runtime has fewer CPU cores than the paper's workstation
  criterion: focal_loss
  loss_weight: null
  loss_weight_decay_rate: 0
  warmup_epochs: 0
  kappa_prior: true
  save_interval: 5
  eval_interval: 1
  sample_view: false
  sample_view_interval: 100
  pin_memory: true

solver:
  optimizer: ADAM
  learning_rate: 0.0002
  lr_scheduler: clipped_cosine
  momentum: 0.5
  nesterov: true
  weight_decay: 0.0005

criterion_args:
  cross_entropy: {}
  mean_square_error: {}
  mean_absolute_error: {}
  smooth_L1: {}
  kappa_loss: {}
  focal_loss:
    alpha: 5
    reduction: mean

scheduler_args:
  exponential:
    gamma: 0.6
  multiple_steps:
    milestones: [15, 25, 45]
    gamma: 0.1
  cosine:
    T_max: 50
    eta_min: 0
  reduce_on_plateau:
    mode: min
    factor: 0.1
    patience: 5
    threshold: 0.0001
    eps: 0.00001
  clipped_cosine:
    T_max: 50
    min_lr: 0.00001

data_augmentation_args:
  horizontal_flip:
    prob: 0.5
  vertical_flip:
    prob: 0.5
  color_distortion:
    prob: 1.0
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.1
  random_crop:
    prob: 1.0
    scale: [0.87, 1.15]
    ratio: [0.7, 1.3]
  rotation:
    prob: 1.0
    degrees: [-180, 180]
  translation:
    prob: 1
    range: [0.2, 0.2]
  grayscale:
    prob: 0.5
  gaussian_blur:
    prob: 0.2
    kernel_size: 7
    sigma: 0.5
  value_fill: 0
